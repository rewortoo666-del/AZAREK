<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оптовый Каталог B2B</title>
    <!-- Подключаем Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Tailwind CSS для быстрого и красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #f3f4f6); color: var(--tg-theme-text-color, #1f2937); }
        .tg-button { background-color: var(--tg-theme-button-color, #2563eb); color: var(--tg-theme-button-text-color, #ffffff); }
    </style>
</head>
<body class="pb-24">

    <!-- Шапка -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">Galk B2B | Опт</h1>
    </header>

    <!-- Сетка товаров (заполняется из JS) -->
    <main class="p-4 grid grid-cols-2 gap-4" id="products-container">
        <!-- Товары появятся здесь -->
    </main>

    <!-- Форма оформления заказа (скрыта по умолчанию) -->
    <div id="checkout-form" class="hidden fixed inset-0 bg-white z-20 p-6 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-4">Оформление заказа</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Название компании / ИП</label>
                <input type="text" id="company" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 bg-gray-50 border" placeholder="ООО Ромашка">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Город и адрес доставки</label>
                <input type="text" id="city" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 bg-gray-50 border" placeholder="г. Москва, ул. Ленина...">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ФИО и телефон</label>
                <input type="text" id="contacts" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 bg-gray-50 border" placeholder="Иван, +7 999 000 00 00">
            </div>
        </div>
        <div class="mt-6 flex gap-2">
            <button onclick="hideCheckout()" class="w-1/3 bg-gray-200 text-gray-800 p-3 rounded-lg font-bold">Назад</button>
            <button onclick="sendOrderToBot()" class="w-2/3 tg-button p-3 rounded-lg font-bold shadow-lg">Отправить счет</button>
        </div>
    </div>

    <!-- Плавающая корзина внизу -->
    <div id="cart-bar" class="fixed bottom-0 w-full bg-white border-t p-4 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] hidden z-10">
        <div>
            <p class="text-sm text-gray-500">Итого оптом:</p>
            <p class="text-xl font-bold" id="total-price">0 ₽</p>
        </div>
        <button onclick="showCheckout()" class="tg-button px-6 py-3 rounded-lg font-bold shadow-md">Оформить</button>
    </div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открыть на весь экран телефона

        // База товаров (в будущем можно подтягивать JSON прямо с твоего сервера)
        const products = [
            { id: 'p1', title: 'Худи Oversize Premium', price: 2500, moq: 10, disc_price: 2100, img: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=300&q=80' },
            { id: 'p2', title: 'Кроссовки B2B Sport', price: 3200, moq: 8, disc_price: 2800, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=300&q=80' },
            { id: 'p3', title: 'Рюкзак Urban', price: 1800, moq: 15, disc_price: 1500, img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=300&q=80' }
        ];

        let cart = {}; // Корзина формата { 'p1': 10, 'p2': 16 }

        // Отрисовка товаров
        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                const qty = cart[p.id] || 0;
                
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow border overflow-hidden flex flex-col">
                        <img src="${p.img}" class="w-full h-32 object-cover">
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="text-sm font-bold text-gray-800 leading-tight mb-1">${p.title}</h3>
                            <p class="text-xs text-gray-500 mb-2">От ${p.moq} шт: <b class="text-blue-600">${p.disc_price}₽</b><br>Розница: ${p.price}₽</p>
                            
                            <div class="mt-auto">
                                ${qty === 0 
                                    ? `<button onclick="updateCart('${p.id}', ${p.moq})" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 py-2 rounded-lg text-sm font-bold transition">Добавить</button>`
                                    : `<div class="flex items-center justify-between bg-blue-50 rounded-lg p-1">
                                        <button onclick="updateCart('${p.id}', ${qty - p.moq})" class="w-8 h-8 flex items-center justify-center text-blue-600 font-bold bg-white rounded shadow-sm">-</button>
                                        <span class="font-bold text-blue-800 text-sm">${qty} шт</span>
                                        <button onclick="updateCart('${p.id}', ${qty + p.moq})" class="w-8 h-8 flex items-center justify-center text-blue-600 font-bold bg-white rounded shadow-sm">+</button>
                                       </div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
            updateCartUI();
        }

        // Логика добавления в корзину
        function updateCart(id, newQty) {
            if (newQty <= 0) {
                delete cart[id];
            } else {
                cart[id] = newQty;
            }
            tg.HapticFeedback.selectionChanged(); // Легкая вибрация при нажатии
            renderProducts();
        }

        // Обновление итоговой суммы
        function updateCartUI() {
            let total = 0;
            let totalItems = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id === id);
                const actualPrice = qty >= product.moq ? product.disc_price : product.price;
                total += actualPrice * qty;
                totalItems += qty;
            }

            const cartBar = document.getElementById('cart-bar');
            if (totalItems > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('total-price').innerText = total.toLocaleString('ru-RU') + ' ₽';
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function showCheckout() {
            document.getElementById('checkout-form').classList.remove('hidden');
        }

        function hideCheckout() {
            document.getElementById('checkout-form').classList.add('hidden');
        }

        // Отправка данных обратно в бота
        function sendOrderToBot() {
            const company = document.getElementById('company').value;
            const city = document.getElementById('city').value;
            const contacts = document.getElementById('contacts').value;

            if (!company || !city || !contacts) {
                tg.showAlert("Пожалуйста, заполните все поля для выставления счета.");
                return;
            }

            let orderItems = [];
            let totalSum = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const p = products.find(p => p.id === id);
                const price = qty >= p.moq ? p.disc_price : p.price;
                const total = price * qty;
                totalSum += total;
                orderItems.push({ title: p.title, qty: qty, price: price, total: total });
            }

            const orderData = {
                cart: orderItems,
                total_sum: totalSum,
                company: company,
                city: city,
                contacts: contacts
            };

            // Передаем JSON строку обратно в Python (сработает web_app_data_handler)
            tg.sendData(JSON.stringify(orderData));
        }

        // Стартовый рендер
        renderProducts();
    </script>
</body>
</html>
